# OwnGains Server + MariaDB. Optional backend for the OwnGains fitness app:
# accounts, workout sync and real-time social features.
# Setup: copy .env.example to .env (set DB_USER, DB_PASSWORD, JWT_SECRET,
# ALLOWED_ORIGINS), then `docker compose up -d`.
services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-owngains}
      MARIADB_USER: ${DB_USER:?set DB_USER in .env}
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    image: superak0s/owngains-server:latest
    # build: .   # uncomment to build from source instead of pulling
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      # mDNS can't reach the LAN from bridge networking.
      MDNS_ENABLED: "false"
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    volumes:
      - backups:/backups
    # Logs hold IPs and user ids; cap them rather than keep them forever.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  # Optional skin marketplace (`docker compose --profile marketplace up -d`).
  # Most self-hosters skip it: every app uses the official marketplace by default.
  marketplace-db:
    image: mariadb:11.4
    profiles: ["marketplace"]
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: owngains_marketplace
      MARIADB_USER: ${DB_USER:?set DB_USER in .env}
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - marketplace-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  marketplace:
    image: superak0s/owngains-marketplace:latest
    # build: { context: ., dockerfile: Dockerfile.marketplace }
    profiles: ["marketplace"]
    restart: unless-stopped
    depends_on:
      marketplace-db:
        condition: service_healthy
    environment:
      DB_HOST: marketplace-db
      DB_PORT: 3306
      DB_NAME: owngains_marketplace
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      PORT: 5100
      DOWNLOAD_SALT: ${DOWNLOAD_SALT:-}
      AUTH_SERVER_URL: ${AUTH_SERVER_URL:-https://owngains.superak0s.com}
      PUBLIC_URL: ${MARKETPLACE_PUBLIC_URL:-http://localhost:5100}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
    ports:
      - "${MARKETPLACE_PORT:-5100}:5100"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

volumes:
  db-data:
  backups:
  marketplace-db-data:
